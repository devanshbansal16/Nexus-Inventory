version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cims
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ../ai-service
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://host.docker.internal:5000
    depends_on:
      - redis

volumes:
  redis_data:
  mongo_data:
